// Updater implementation and release checks live in the standalone reference.
ext.chamomiloUpdaterReference = project.findProperty('chamomiloUpdaterReference') ?:
        System.getenv('CHAMOMILO_UPDATER_REFERENCE') ?: 'C:/projects/updater'
def reference = file(chamomiloUpdaterReference)
if (!new File(reference, 'version.properties').isFile())
    throw new GradleException('Missing updater reference: ' + reference)
apply from: new File(reference, 'gradle/chamomilo-updater.gradle')

// Other consumers also build the canonical repository. Keep its clean/test
// intermediates independent while compiling the same sources and reference JAR.
tasks.named('buildChamomiloUpdaterReference', GradleBuild) {
    startParameter.initScripts += file('gradle/updater-build-directory.gradle')
    startParameter.projectProperties += [highResUpdaterBuildDir: file("${buildDir}/reference/updater").absolutePath]
}
