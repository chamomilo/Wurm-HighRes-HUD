// Shared release checks for an embedded Chamomilo updater. No game files are modified.
task verifyChamomiloUpdater(dependsOn: jar) {
    doLast {
        def contents = zipTree(tasks.jar.archivePath)
        ['org/chamomilo/wurm/update/SharedUpdateCoordinator.class',
         'org/chamomilo/wurm/update/ModCatalog.class',
         'org/chamomilo/wurm/update/SharedUpdateHooks.class',
         'com/wurmonline/client/renderer/gui/ChamomiloUpdateWindow.class',
         'com/wurmonline/client/renderer/gui/ChamomiloUpdateBridge.class',
         'com/wurmonline/client/resources/ChamomiloResourceUrl.class',
         'org/chamomilo/wurm/update/update-frame.png'].each { required ->
            if (contents.matching { include required }.files.empty)
                throw new GradleException('Missing shared updater component: ' + required)
        }
        sourceSets.main.output.classesDirs.asFileTree.matching {
            include 'org/chamomilo/wurm/update/**'
            include 'com/wurmonline/client/renderer/gui/ChamomiloUpdate*.class'
        }.visit { entry ->
            if (!entry.directory && contents.matching { include entry.relativePath.pathString }.files.empty)
                throw new GradleException('Missing nested updater class: ' + entry.relativePath)
        }
        def metadata = new Properties()
        file(chamomiloUpdate.properties).withInputStream { metadata.load(it) }
        [sharedClassLoader:'true', updateProvider:'chamomilo', updateCoordinatorProtocol:'1',
         updateId:chamomiloUpdate.id, updateName:chamomiloUpdate.name,
         updateRepo:chamomiloUpdate.repo, updateAsset:chamomiloUpdate.asset,
         version:project.version.toString()].each { key, expected ->
            if (metadata.getProperty(key) != expected)
                throw new GradleException('Incorrect updater metadata ' + key + ': expected ' + expected)
        }
        def main = file(chamomiloUpdate.main).getText('UTF-8')
        if (!main.contains('ModListener') || !main.contains('SharedUpdateCoordinator.modInitialized')
                || !(main.contains('SharedUpdateHooks.registerHost') || main.contains('SharedUpdateCoordinator.registerHost')))
            throw new GradleException('Missing updater lifecycle integration')
        def version = main =~ /VERSION\s*=\s*"([^"]+)"/
        if (!version.find() || version.group(1) != project.version.toString())
            throw new GradleException('Main mod version differs from distribution')
    }
}
build.dependsOn verifyChamomiloUpdater
tasks.findByName('dist')?.dependsOn verifyChamomiloUpdater
tasks.findByName('publicationZip')?.dependsOn verifyChamomiloUpdater
