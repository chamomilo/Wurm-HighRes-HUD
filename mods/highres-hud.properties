classname=org.highreshud.client.HighResHudMod
classpath=highres-hud-0.1.1.jar
sharedClassLoader=true

updateProvider=chamomilo
updateCoordinatorProtocol=1
updateId=highres-hud
updateName=High-res HUD
updateRepo=chamomilo/Wurm-HighRes-HUD
updateAsset=highres-hud-{version}.zip

# One mod, one hook installer, three independently configurable HUD panels.
healthbar.enabledByDefault=true
selectbar.enabledByDefault=true
fightingHud.enabledByDefault=true

resourcePack=mods/highres-hud/highres-hud-resources-0.1.1.jar

healthbar.portraitRenderSize=256
healthbar.portraitRotation=45
healthbar.portraitFov=45
healthbar.portraitCropWidth=0.40
healthbar.portraitCropHeight=0.42

selectbar.portraitRenderSize=512
fightingHud.portraitRenderSize=512
portraitProfilesOverride=mods/highres-hud/portrait-profiles.properties

healthbar.fatigueRefreshSeconds=60
healthbar.fatigueInitialDelaySeconds=4
healthbar.animateRisingGauges=true
selectbar.animateGaugeShine=true
fightingHud.animateGaugeShine=true
fightingHud.collectCombatKnowledge=true
fightingHud.knowledgeDirectory=mods/highres-hud/knowledge
